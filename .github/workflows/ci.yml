name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The workspace is pre-Phase-0, so the Rust and web jobs are guarded. Each guard flips itself on
  # when its manifest appears; delete the guard rather than the job when the workspace lands.
  detect:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.probe.outputs.rust }}
      web: ${{ steps.probe.outputs.web }}
    steps:
      - uses: actions/checkout@v5
      - id: probe
        run: |
          set -euo pipefail
          if [ -f src-tauri/Cargo.toml ]; then echo "rust=true" >> "$GITHUB_OUTPUT"; else echo "rust=false" >> "$GITHUB_OUTPUT"; fi
          if [ -f vite.config.ts ]; then echo "web=true" >> "$GITHUB_OUTPUT"; else echo "web=false" >> "$GITHUB_OUTPUT"; fi

  # Always runs. Checks the agent layer (skill frontmatter, links, AGENTS.md budget) and the script
  # tests. The checker runs before the install, which proves it stays dependency-free; the tests run
  # after it, because the Jev tools' tests import their modules. No step calls Jev: CI has no key.
  agent-layer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: node scripts/check-skills.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm run scripts:test

  rust:
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libssl-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: cargo fmt --all --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri

  web:
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test -- --run
      - run: pnpm run build
